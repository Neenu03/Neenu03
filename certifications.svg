    .pilltext { font:700 10px Arial,sans-serif; fill:#007C83; letter-spacing:.5px; }
    .number { font:700 13px Arial,sans-serif; fill:#00A6AA; }
    .footer { font:12px Arial,sans-serif; fill:#718493; letter-spacing:.5px; }
