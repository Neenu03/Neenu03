  <rect x="970" y="275" width="145" height="37" rx="9" class="pill"/>
  <text x="987" y="299" class="pill-text">Tableau</text>
  <rect x="825" y="323" width="135" height="37" rx="9" class="pill"/>
  <text x="842" y="347" class="pill-text">Matplotlib</text>
  <rect x="970" y="323" width="145" height="37" rx="9" class="pill"/>
  <text x="987" y="347" class="pill-text">Seaborn</text>
  <text x="825" y="395" class="muted">Dashboards • Charts • Data storytelling</text>

  <!-- Card 4: Data Analysis -->
  <rect x="55" y="445" width="345" height="205" rx="17" class="card"/>
  <text x="80" y="477" class="number">04 / ANALYZE</text>
  <text x="80" y="508" class="card-title">Data Analysis &amp; Tools</text>
  <circle cx="355" cy="473" r="5" class="dot"/>
  <rect x="80" y="530" width="125" height="37" rx="9" class="pill"/>
  <text x="97" y="554" class="pill-text">Pandas</text>
  <rect x="215" y="530" width="145" height="37" rx="9" class="pill"/>
  <text x="232" y="554" class="pill-text">NumPy</text>
  <rect x="80" y="578" width="125" height="37" rx="9" class="pill"/>
  <text x="97" y="602" class="pill-text">Excel</text>
  <rect x="215" y="578" width="145" height="37" rx="9" class="pill"/>
  <text x="232" y="602" class="pill-text">Git</text>

  <!-- Card 5: Web & Workflow -->
  <rect x="420" y="445" width="360" height="205" rx="17" class="card"/>
  <text x="445" y="477" class="number">05 / BUILD</text>
  <text x="445" y="508" class="card-title">Web &amp; Development</text>
  <circle cx="735" cy="473" r="5" class="dot"/>
  <rect x="445" y="530" width="135" height="37" rx="9" class="pill"/>
  <text x="462" y="554" class="pill-text">HTML</text>
  <rect x="590" y="530" width="155" height="37" rx="9" class="pill"/>
  <text x="607" y="554" class="pill-text">CSS</text>
  <rect x="445" y="578" width="135" height="37" rx="9" class="pill"/>
  <text x="462" y="602" class="pill-text">GitHub</text>
  <rect x="590" y="578" width="155" height="37" rx="9" class="pill"/>
  <text x="607" y="602" class="pill-text">Git</text>

  <!-- Card 6: Foundations -->
  <rect x="800" y="445" width="345" height="205" rx="17" class="card"/>
  <text x="825" y="477" class="number">06 / FOUNDATIONS</text>
  <text x="825" y="508" class="card-title">Mathematical Skills</text>
  <circle cx="1100" cy="473" r="5" class="dot"/>
  <rect x="825" y="530" width="135" height="37" rx="9" class="pill"/>
  <text x="842" y="554" class="pill-text">Statistics</text>
  <rect x="970" y="530" width="145" height="37" rx="9" class="pill"/>
  <text x="987" y="554" class="pill-text">Probability</text>
  <rect x="825" y="578" width="290" height="37" rx="9" class="pill"/>
  <text x="842" y="602" class="pill-text">Predictive Modelling</text>

  <!-- Footer -->
  <rect x="55" y="680" width="1090" height="1" fill="#1C465A"/>
  <circle cx="62" cy="718" r="4" fill="#00C9C8"/>
  <text x="77" y="723" class="muted">DATA ANALYSIS</text>
  <circle cx="230" cy="718" r="4" fill="#00C9C8"/>
  <text x="245" y="723" class="muted">MACHINE LEARNING</text>
  <circle cx="430" cy="718" r="4" fill="#00C9C8"/>
  <text x="445" y="723" class="muted">DATA VISUALIZATION</text>
  <text x="1145" y="723" text-anchor="end" class="number">NEENU / PORTFOLIO</text>
